services:
  postgres:
    image: postgres:16-alpine
    container_name: meterflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: meterflow
      POSTGRES_USER: meterflow
      POSTGRES_PASSWORD: meterflow_dev
    ports:
      - "5432:5432"
    volumes:
      - meterflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meterflow -d meterflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  meterflow_postgres_data:
