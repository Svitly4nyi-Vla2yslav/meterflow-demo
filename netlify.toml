[build]
  command = "npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@nestjs/common", "@nestjs/config", "@nestjs/core", "@nestjs/jwt", "@nestjs/mapped-types", "@nestjs/passport", "@nestjs/platform-express", "@netlify/blobs", "@prisma/client", "bcrypt", "class-transformer", "class-validator", "express", "passport", "passport-jwt", "reflect-metadata", "rxjs", "serverless-http"]
  included_files = [
    "node_modules/.prisma/client/**",
    "backend/node_modules/.prisma/client/**",
    "backend/node_modules/@prisma/client/**"
  ]

[dev]
  command = "npm run dev --prefix frontend -- --host 0.0.0.0"
  targetPort = 5173
  port = 8888
  autoLaunch = false

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
